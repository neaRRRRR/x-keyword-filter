<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>Settings regression test</title>
<form>
  <fieldset id="controls" disabled>
    <input type="radio" name="mode" value="blur">
    <input type="radio" name="mode" value="remove">
  </fieldset>
  <fieldset id="lists" disabled>
    <button id="add-list" type="button">New list</button>
    <fieldset id="list-editor" hidden disabled>
      <select id="list"></select>
      <input id="list-name" required>
      <input id="list-enabled" type="checkbox">
      <textarea id="keywords"></textarea>
    </fieldset>
    <button type="submit">Save</button>
  </fieldset>
  <p id="status"></p>
</form>
<script>
  let storedSettings;
  const testMode = new URLSearchParams(location.search).get("mode");
  const previousSettings = {
    mode: "remove",
    lists: [
      { name: "Events", enabled: true, keywords: ["Outdoor market"] },
      { name: "News", enabled: false, keywords: ["Weather report"] }
    ]
  };
  chrome.storage = { local: {
    get: async (defaults) => structuredClone(testMode === "saved-settings" ? previousSettings : defaults),
    set: async (settings) => { storedSettings = structuredClone(settings); }
  } };
</script>
<script src="../x-keyword-filter/preferences.js"></script>
<script src="../x-keyword-filter/settings.js"></script>
<script>
  (async () => {
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    await Promise.resolve();
    if (testMode === "saved-settings") {
      form.requestSubmit();
      await Promise.resolve();
      assert(JSON.stringify(storedSettings) === JSON.stringify(previousSettings), "The update overwrote saved lists or mode");
      return;
    }
    assert(form.elements.mode.value === "blur" && listEditor.hidden && listInput.options.length === 0, "A fresh installation enabled a list");
    form.requestSubmit();
    await Promise.resolve();
    assert(storedSettings.lists.length === 0, "Saving without a list created one");

    document.getElementById("add-list").click();
    assert(!listEditor.hidden && !enabledInput.checked && keywordsInput.value === "", "A new list was not empty and inactive");

    nameInput.value = "Events";
    keywordsInput.value = "Outdoor market";
    document.getElementById("add-list").click();
    assert(!enabledInput.checked, "New lists started enabled");
    nameInput.value = "News";
    enabledInput.checked = true;
    keywordsInput.value = Array.from({ length: 5000 }, (_, index) => `keyword ${index}`).join("\n");
    listInput.value = "0";
    listInput.dispatchEvent(new Event("change"));
    assert(!enabledInput.checked && keywordsInput.value === "Outdoor market", "Switching lists discarded edits");

    form.elements.mode.value = "remove";
    form.requestSubmit();
    await Promise.resolve();
    const [first, second] = storedSettings.lists;
    assert(storedSettings.mode === "remove", "The removal setting was lost");
    assert(!first.enabled && first.name === "Events" && first.keywords.includes("Outdoor market"), "The edited list was lost");
    assert(second.enabled && second.name === "News" && second.keywords[4999] === "keyword 4999", "The new list or keywords were lost");
  })().then(
    () => parent.postMessage({ mode: testMode, result: "pass" }, "*"),
    (error) => parent.postMessage({ mode: testMode, result: `fail ${error.message}` }, "*")
  );
</script>
