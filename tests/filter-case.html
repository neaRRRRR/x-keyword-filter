<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>X filter regression test</title>
<link rel="stylesheet" href="../x-keyword-filter/content.css">
<style>
  body > article, [data-testid="cellInnerDiv"] > article { min-height: 72px; }
  [data-testid="cellInnerDiv"] { display: flex; flex-direction: column; }
</style>
<body data-result="running">
<div data-testid="cellInnerDiv" id="direct-row">
  <article data-testid="tweet" id="direct">
    <a href="https://x.com/example/status/1"><time>1m</time></a>
    <div data-testid="tweetText">Proje—Vİ’nin yeni videosu</div>
  </article>
</div>
<div data-testid="cellInnerDiv" id="quote-row">
  <article data-testid="tweet" id="quote">
    <div data-testid="tweetText">Did you see this?</div>
    <div role="link"><div lang="en" dir="auto">Aurora <span>Festival</span></div><div>18 likes</div></div>
  </article>
</div>
<article data-testid="tweet" id="link"><a href="https://example.com/outdoor-market">See this</a></article>
<article data-testid="tweet" id="roman">Etkinlik V'i tekrar izliyorum</article>
<article data-testid="tweet" id="another-topic">Tomorrow's weather report</article>
<article data-testid="tweet" id="clean">
  <div data-testid="tweetText">NorthwindForecast and marketplace news</div>
  <article data-testid="tweet" id="clean-quote"><div data-testid="tweetText">Sunny today</div></article>
</article>
<article data-testid="tweet" id="late"><div lang="en" dir="auto" id="late-quote">Loading</div></article>
<aside id="unrelated">Outdoor market</aside>
<script>
  const mode = new URLSearchParams(location.search).get("mode");
  const revealLabel = mode === "blur-en" ? "Show" : "Göster";
  const direct = document.getElementById("direct");
  const quote = document.getElementById("quote");
  const link = document.getElementById("link");
  const roman = document.getElementById("roman");
  const anotherTopic = document.getElementById("another-topic");
  const clean = document.getElementById("clean");
  const late = document.getElementById("late");
  const rowHeight = direct.offsetHeight;
  const initiallyHidden = getComputedStyle(direct).visibility === "hidden";
  chrome.i18n = { getMessage: (key) => key === "reveal_post" ? revealLabel : "" };
  chrome.storage = { local: { get: async (defaults) => mode === "default" ? defaults : ({
    mode: mode === "blur-en" ? "blur" : mode,
    lists: [
      {
        name: "Events",
        enabled: mode !== "inactive",
        keywords: ["Proje VI", "Aurora Festival", "Outdoor market", "Etkinlik V", "ProjeVIDuyuru", "Community meetup"]
      },
      { name: "Weather", enabled: true, keywords: ["Weather report"] },
      { name: "Inactive", enabled: false, keywords: ["NorthwindForecast"] }
    ]
  }) } };
</script>
<script src="../x-keyword-filter/preferences.js"></script>
<script src="../x-keyword-filter/content.js"></script>
<script>
  (async () => {
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const afterMutations = () => new Promise((resolve) => setTimeout(resolve, 0));
    const assertFiltered = (post, message) => {
      if (mode === "remove") {
        assert(!post.isConnected, message);
      } else {
        assert(post.isConnected && post.inert && /^blur\(/.test(getComputedStyle(post).filter), message);
      }
    };
    const revealButton = (post) => {
      const bounds = post.getBoundingClientRect();
      return Array.from(document.querySelectorAll("button")).find((button) => {
        const rect = button.getBoundingClientRect();
        return button.textContent === revealLabel && rect.width > 0 &&
          rect.top >= bounds.top && rect.top <= bounds.top + 16 &&
          rect.right <= bounds.right && rect.right >= bounds.right - 16;
      });
    };

    assert(initiallyHidden, "A post was visible before the content script classified it");
    await afterMutations();
    if (mode === "default") {
      assert(getComputedStyle(direct).filter === "none" && getComputedStyle(direct).visibility === "visible", "Posts were filtered on a fresh installation");
      document.body.insertAdjacentHTML("beforeend", '<article data-testid="tweet" id="new-post">#ProjeVİDuyuru</article>');
      assert(getComputedStyle(document.getElementById("new-post")).visibility === "visible", "A fresh installation briefly hid a new post");
      return;
    }
    assertFiltered(anotherTopic, "An active custom list was ignored");
    assert(getComputedStyle(clean).visibility === "visible" && getComputedStyle(clean).filter === "none", "An inactive list filtered an unrelated post");
    if (mode === "inactive") {
      assert(getComputedStyle(direct).visibility === "visible" && getComputedStyle(direct).filter === "none", "The disabled event list still filtered posts");
      return;
    }
    assertFiltered(direct, "The title variant in the main post was missed");
    assertFiltered(quote, "A quote-only match did not filter the entire outer post");
    assertFiltered(link, "The keyword in the link was missed");
    assertFiltered(roman, "The Roman numeral phrase was missed");
    assert(getComputedStyle(document.getElementById("clean-quote")).visibility === "visible", "An unrelated nested quote was hidden");
    assert(getComputedStyle(document.getElementById("unrelated")).visibility === "visible", "Page text outside a post was filtered");
    if (mode === "remove") {
      assert(!document.querySelector("button"), "Removal added reveal controls");
      assert(document.getElementById("direct-row").offsetHeight === 0, "A removed post left a visible timeline cell");
      document.getElementById("direct-row").innerHTML = '<article data-testid="tweet" id="replacement">Sports scores</article>';
    } else {
      assert(direct.offsetHeight === rowHeight, "Blurring changed the height of the post");
      const button = revealButton(direct);
      const standaloneButton = revealButton(link);
      assert(button && !button.closest("[inert]") && standaloneButton, "A blurred post is missing its accessible corner button");
      let bubbled = false;
      direct.parentElement.addEventListener("click", () => { bubbled = true; }, { once: true });
      button.focus();
      const rect = button.getBoundingClientRect();
      assert(document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2) === button, "The corner button was covered by the blurred post");
      button.click();
      assert(!direct.inert && getComputedStyle(direct).filter === "none" && !button.isConnected, "Clicking the button did not reveal the post");
      assert(!bubbled && document.activeElement === direct, "Revealing caused a page click or lost keyboard focus");
      assertFiltered(quote, "Revealing one post opened another");
      const time = direct.querySelector("time");
      time.textContent = "2m";
      link.remove();
      await afterMutations();
      assert(getComputedStyle(direct).filter === "none", "An update hid the revealed post again");
      assert(!standaloneButton.isConnected, "A removed post left its reveal button behind");
      time.parentElement.href = "https://x.com/example/status/2";
      await afterMutations();
      assertFiltered(direct, "A recycled post inherited the old reveal");
      const recycledButton = revealButton(direct);
      assert(recycledButton, "A recycled post was missing its reveal button");
      direct.querySelector('[data-testid="tweetText"]').textContent = "Sports scores";
      await afterMutations();
      assert(!recycledButton.isConnected, "A clear post retained its reveal button");
    }

    document.body.insertAdjacentHTML("beforeend", '<article data-testid="tweet" id="new-post">#ProjeVİDuyuru</article>');
    const inserted = document.getElementById("new-post");
    assert(getComputedStyle(inserted).visibility === "hidden", "A newly inserted post flashed unfiltered");
    document.getElementById("late-quote").firstChild.data = "Community meetup";
    await afterMutations();
    assertFiltered(inserted, "A newly inserted post was missed");
    assertFiltered(late, "Text loaded into an existing quote was missed");
    const reused = mode === "remove" ? document.getElementById("replacement") : direct;
    assert(getComputedStyle(reused).visibility === "visible" && getComputedStyle(reused).filter === "none" && !reused.inert, "A reused post or cell stayed filtered");
  })().then(
    () => parent.postMessage({ mode, result: "pass" }, "*"),
    (error) => parent.postMessage({ mode, result: `fail ${error.message}` }, "*")
  );
</script>
</body>
</html>
